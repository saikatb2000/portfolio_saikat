<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embedded Google Form</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .responsive-iframe {
      position: relative;
      width: 100%;
      padding-bottom: 160%; /* Adjust this for aspect ratio */
      height: 0;
      overflow: hidden;
    }

    .responsive-iframe iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media screen and (max-width: 600px) {
      .form-container {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="responsive-iframe">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdwmDNwSyW1TqNYbEJundBGniTwq0FfBvVZXshWFd2SxesY2g/viewform?embedded=true" allowfullscreen>
        Loading…
      </iframe>
    </div>
  </div>

</body>
</html>
